<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快马 AI WebUI</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="top">
    <div class="brand">快马 AI WebUI</div>
    <div class="tabs">
      <button class="active" data-tab="image">生图</button>
      <button data-tab="balance">余额</button>
      <button data-tab="recharge">充值</button>
    </div>
  </div>

  <main class="wrap">
    <section id="image" class="view active">
      <div class="grid">
        <form id="genForm" class="panel">
          <h2>图片生成</h2>
          <div class="field">
            <label>提示词</label>
            <textarea name="prompt" required placeholder="描述要生成或编辑的图片"></textarea>
          </div>
          <div class="field">
            <label>参考图（可选，多张为改图）</label>
            <input name="images" type="file" accept="image/*" multiple>
          </div>
          <div class="row">
            <div class="field">
              <label>模型</label>
              <input name="image_model">
            </div>
            <div class="field">
              <label>尺寸</label>
              <input name="image_size" placeholder="auto">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>质量</label>
              <select name="image_quality">
                <option>auto</option>
                <option>low</option>
                <option>medium</option>
                <option>high</option>
              </select>
            </div>
            <div class="field">
              <label>张数</label>
              <input name="image_count" type="number" min="1" max="10">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>格式</label>
              <select name="image_output_format">
                <option value="">默认</option>
                <option>png</option>
                <option>jpeg</option>
                <option>webp</option>
              </select>
            </div>
            <div class="field">
              <label>压缩（-1 表示默认）</label>
              <input name="image_output_compression" type="number" min="-1" max="100">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>背景</label>
              <select name="image_background">
                <option>auto</option>
                <option>transparent</option>
                <option>opaque</option>
              </select>
            </div>
            <div class="field">
              <label>审核</label>
              <select name="image_moderation">
                <option value="">默认</option>
                <option>auto</option>
                <option>low</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" type="submit">生成</button>
            <span id="genStatus" class="status"></span>
          </div>
        </form>

        <div class="panel">
          <h2>结果</h2>
          <div id="gallery" class="gallery"></div>
        </div>
      </div>
    </section>

    <section id="balance" class="view">
      <div class="panel">
        <div class="actions">
          <button id="balanceBtn" class="btn primary">刷新余额</button>
          <span id="balanceStatus" class="status"></span>
        </div>
        <div id="balanceBox" class="section-body"></div>
      </div>
    </section>

    <section id="recharge" class="view">
      <div class="grid">
        <div class="panel">
          <h2>直接充值</h2>
          <div class="field">
            <label>金额（元）</label>
            <input id="amount" type="number" min="1" step="0.01" placeholder="100">
          </div>
          <button id="amountPay" class="btn primary">生成支付</button>

          <h2 class="subhead">订阅套餐</h2>
          <div class="actions">
            <button id="loadPlans" class="btn">加载套餐</button>
            <span id="rechargeStatus" class="status"></span>
          </div>
          <div id="plans" class="section-body"></div>
        </div>
        <div class="panel">
          <h2>支付</h2>
          <div id="payment"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
