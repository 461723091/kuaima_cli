<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快马 AI WebUI</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>快马 AI WebUI</span>
    </div>
    <div class="billing-menu">
      <button id="toggleBillingTop" class="wallet-pill" type="button" aria-expanded="false">
        <span>可用余额</span>
        <strong id="balanceTop">读取中...</strong>
      </button>
      <div id="billingDropdown" class="billing-dropdown" hidden>
        <div class="menu-row">
          <span>账号</span>
          <strong id="accountName">-</strong>
        </div>
        <div class="menu-row">
          <span>已消耗</span>
          <strong id="usedTop">-</strong>
        </div>
        <a id="usageDetailLink" class="detail-link" href="#" target="_blank" rel="noreferrer">查看使用详情</a>

        <div class="menu-divider"></div>

        <div class="field">
          <label>直接充值</label>
          <div id="amountOptions" class="chip-grid"></div>
          <div class="amount-row">
            <input id="amount" type="number" min="1" step="0.01" placeholder="输入金额">
            <button id="amountPay" class="btn" type="button">支付</button>
          </div>
        </div>

        <div class="section-title">
          <span>套餐</span>
          <span id="rechargeStatus" class="status"></span>
        </div>
        <div id="plans" class="plans"></div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="hero-panel">
      <div>
        <p class="eyebrow">Image Studio</p>
        <h1>图像生成工作台</h1>
      </div>
    </section>

    <section class="layout">
      <aside id="historySidebar" class="panel history-sidebar">
        <div class="panel-head">
          <div>
            <p class="eyebrow">History</p>
            <h2>历史记录</h2>
          </div>
          <button id="toggleHistory" class="icon-btn" type="button" aria-label="收起历史记录" aria-expanded="true">‹</button>
        </div>
        <div id="historyPanel" class="history-panel"></div>
      </aside>

      <form id="genForm" class="panel generator">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Prompt</p>
            <h2>生成参数</h2>
          </div>
        </div>

        <div class="field prompt-field">
          <label>提示词</label>
          <div class="prompt-composer">
            <textarea name="prompt" required placeholder="描述你想生成或编辑的图片，例如：未来感产品海报，金属材质，柔和棚拍灯光，高级科技风。"></textarea>
            <div class="composer-actions">
              <label class="upload-button" for="imageInput" title="上传参考图">
                <span class="upload-icon">+</span>
                <span>参考图</span>
              </label>
              <input id="imageInput" class="sr-only" name="images" type="file" accept="image/*" multiple>
              <button id="cancelGenerate" class="btn cancel-generate" type="button" hidden>取消</button>
              <button class="btn primary" type="submit">生成图片</button>
            </div>
          </div>
          <div id="genStatus" class="status gen-status"></div>
          <div id="imagePreviewList" class="image-preview-list empty">上传参考图后可预览、删除和调整顺序</div>
        </div>

        <div class="row">
          <div class="field">
            <label>模型</label>
            <select name="image_model">
              <option value="gpt-image-2">gpt-image-2</option>
              <option value="gpt-image-1.5">gpt-image-1.5</option>
              <option value="gpt-image-1">gpt-image-1</option>
            </select>
          </div>
          <div class="field">
            <label>张数</label>
            <input name="image_count" type="number" min="1" max="10" value="1">
          </div>
        </div>

        <input name="image_size" type="hidden" value="1024x1024">
        <details class="advanced-options">
          <summary>
            <span>高级选项</span>
            <span id="sizePreview">1024x1024</span>
          </summary>
          <div class="row">
            <div class="field">
              <label>比例</label>
              <select id="ratioSelect" class="sr-only" aria-label="比例">
                <option value="1:1">1:1</option>
                <option value="2:3">2:3</option>
                <option value="3:2">3:2</option>
              </select>
              <div class="ratio-options" role="group" aria-label="比例">
                <button class="ratio-option active" type="button" data-ratio="1:1">
                  <span class="ratio-icon square"></span>
                  <span><b>1:1</b><small>方形</small></span>
                </button>
                <button class="ratio-option" type="button" data-ratio="2:3">
                  <span class="ratio-icon portrait"></span>
                  <span><b>2:3</b><small>竖版</small></span>
                </button>
                <button class="ratio-option" type="button" data-ratio="3:2">
                  <span class="ratio-icon landscape"></span>
                  <span><b>3:2</b><small>横版</small></span>
                </button>
              </div>
            </div>
            <div class="field">
              <label>分辨率</label>
              <select id="resolutionSelect">
                <option value="1k">1k</option>
                <option value="2k">2k</option>
                <option value="4k">4k</option>
              </select>
            </div>
          </div>

          <div class="field compact">
            <label>画质</label>
            <select name="image_quality">
              <option value="auto">自动</option>
              <option value="low">快速</option>
              <option value="medium">标准</option>
              <option value="high">高清</option>
            </select>
          </div>
          <div class="field compact">
            <label>端点</label>
            <select name="image_endpoint">
              <option value="response">Response 接口</option>
              <option value="image">Image 接口</option>
            </select>
          </div>
        </details>

        <div class="output-dir-box">
          <label>图片生成结果目录</label>
          <div class="output-dir-row">
            <input name="save_dir" type="text" autocomplete="off" spellcheck="false" placeholder="输入本机保存目录路径">
            <button id="chooseOutputDir" class="btn small" type="button">应用目录</button>
            <button id="openDefaultOutputDir" class="btn small" type="button">打开文件夹</button>
          </div>
          <div id="saveDirStatus" class="status"></div>
        </div>
      </form>

      <section id="resultsPanel" class="panel results" hidden>
        <div class="panel-head">
          <div>
            <p class="eyebrow">Output</p>
            <h2>结果预览</h2>
          </div>
        </div>
        <div id="gallery" class="gallery"></div>
      </section>
    </section>
  </main>

  <div id="paymentModal" class="modal-backdrop" hidden>
    <div class="payment-modal" role="dialog" aria-modal="true" aria-labelledby="paymentTitle">
      <button id="closePaymentModal" class="modal-close" type="button" aria-label="关闭">×</button>
      <p class="eyebrow">WeChat Pay</p>
      <h2 id="paymentTitle">微信扫一扫支付</h2>
      <div id="paymentModalBody" class="modal-body">
        <span class="status">正在创建支付订单...</span>
      </div>
    </div>
  </div>

  <div id="imageModal" class="modal-backdrop image-modal-backdrop" hidden>
    <div class="image-modal" role="dialog" aria-modal="true" aria-labelledby="imagePreviewTitle">
      <button id="closeImageModal" class="modal-close" type="button" aria-label="关闭">×</button>
      <div class="image-modal-head">
        <div>
          <p class="eyebrow">Preview</p>
          <h2 id="imagePreviewTitle">图片预览</h2>
        </div>
        <span id="imageModalSize" class="image-size-label">-</span>
      </div>
      <img id="imageModalImg" alt="生成结果预览">
    </div>
  </div>

  <script src="/app.js"></script>
</body>

</html>
